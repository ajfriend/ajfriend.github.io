<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GeoJSON Viz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --sidebar: #161b22;
    --input-bg: #0d1117;
    --text: #c9d1d9;
    --text-dim: rgba(201, 209, 217, 0.55);
    --text-dimmer: rgba(201, 209, 217, 0.3);
    --border: rgba(240,246,252,0.1);
    --border-focus: rgba(240,246,252,0.3);
    --btn-bg: rgba(240,246,252,0.04);
    --btn-hover: rgba(240,246,252,0.1);
    --btn-active: rgba(240,246,252,0.16);
    --accent: #4a9eff;
    --accent-glow: rgba(74, 158, 255, 0.15);
    --land-stroke: #6e7e96;
    --grid-stroke: #c9d1d9;
    --grid-opacity: 0.04;
    --sphere-stroke: #3d4856;
    --cell-fill: #4a9eff;
    --slider-track: rgba(240,246,252,0.08);
    --slider-fill: var(--accent);
  }
  .mid {
    --bg: #1c1520;
    --sidebar: #261e2b;
    --input-bg: #1c1520;
    --text: #e8ddd0;
    --text-dim: rgba(232, 221, 208, 0.6);
    --text-dimmer: rgba(232, 221, 208, 0.35);
    --border: rgba(232, 180, 120, 0.1);
    --border-focus: rgba(232, 180, 120, 0.3);
    --btn-bg: rgba(232, 180, 120, 0.06);
    --btn-hover: rgba(232, 180, 120, 0.14);
    --btn-active: rgba(232, 180, 120, 0.2);
    --accent: #e8a44a;
    --accent-glow: rgba(232, 164, 74, 0.18);
    --land-stroke: #8a7568;
    --grid-stroke: #e8ddd0;
    --grid-opacity: 0.04;
    --sphere-stroke: #4a3d4f;
    --cell-fill: #e89050;
    --slider-track: rgba(232, 180, 120, 0.1);
    --slider-fill: var(--accent);
  }
  .light {
    --bg: #eef0f3;
    --sidebar: #ffffff;
    --input-bg: #ffffff;
    --text: #1a1d21;
    --text-dim: rgba(26, 29, 33, 0.6);
    --text-dimmer: rgba(26, 29, 33, 0.4);
    --border: rgba(0,0,0,0.18);
    --border-focus: rgba(0,0,0,0.4);
    --btn-bg: rgba(0,0,0,0.07);
    --btn-hover: rgba(0,0,0,0.13);
    --btn-active: rgba(0,0,0,0.2);
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.15);
    --land-stroke: #656d76;
    --grid-stroke: #1f2328;
    --grid-opacity: 0.06;
    --sphere-stroke: #afb8c1;
    --cell-fill: #2563eb;
    --slider-track: rgba(31,35,40,0.1);
    --slider-fill: var(--accent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* Globe */
  #globe {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
    cursor: grab;
    position: relative;
  }
  #globe:active { cursor: grabbing; }

  /* Sidebar */
  .input-bar {
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    background: var(--sidebar);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background 0.3s ease;
  }

  /* Header row */
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .theme-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }
  .theme-toggle:hover { color: var(--text); }
  .theme-toggle svg { width: 16px; height: 16px; }
  .header-buttons {
    display: flex;
    gap: 4px;
  }

  /* Help popover */
  .help-popover {
    display: none;
    background: var(--sidebar);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.7rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .help-popover.open { display: block; }
  .help-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .help-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 2px 0;
    color: var(--text);
    font-size: 0.7rem;
  }
  .help-row kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 5px;
    min-width: 20px;
    text-align: center;
  }

  /* Status row */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .status.error {
    color: #f85149;
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--text-dimmer);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    padding: 2px 0;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .clear-btn:hover { color: var(--accent); }

  /* Textarea */
  .textarea-wrap {
    position: relative;
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
    z-index: 1;
  }
  .copy-btn:hover { color: var(--text); background: var(--btn-hover); }
  .copy-btn.copied { color: #22c55e; }
  .input-bar textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 400;
    line-height: 1.6;
    padding: 10px 12px;
    resize: none;
    outline: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .input-bar textarea::placeholder {
    color: var(--text-dimmer);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.75rem;
    font-style: italic;
  }
  .input-bar textarea:focus {
    border-color: var(--border-focus);
  }

  /* Dividers */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0;
  }

  /* Desktop layout */
  @media (min-width: 768px) {
    body {
      flex-direction: row;
    }
    .input-bar {
      width: 320px;
      flex-shrink: 0;
      border-top: none;
      border-right: 1px solid var(--border);
      order: -1;
      padding: 16px;
      gap: 14px;
    }
    .textarea-wrap {
      flex: 1;
    }
    .input-bar textarea {
      height: 100%;
      resize: none;
    }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div class="input-bar">
  <div class="sidebar-header">
    <span class="sidebar-title">GeoJSON Viz</span>
    <div class="header-buttons">
    <button class="theme-toggle" id="copyImageBtn" title="Copy globe as image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
    <button class="theme-toggle" id="downloadImageBtn" title="Download globe as PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="theme-toggle" id="helpToggle" title="Keyboard shortcuts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </button>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
    </div>
  </div>
  <div class="help-popover" id="helpPopover">
    <div class="help-title">Keyboard</div>
    <div class="help-row"><kbd>W</kbd> <kbd>S</kbd> <span>Tilt up/down</span></div>
    <div class="help-row"><kbd>A</kbd> <kbd>D</kbd> <span>Roll left/right</span></div>
    <div class="help-row"><kbd>Q</kbd> <kbd>E</kbd> <span>Spin on screen</span></div>
    <div class="help-row"><kbd>&uarr;&darr;&larr;&rarr;</kbd> <span>Tilt / spin</span></div>
    <div class="help-row"><kbd>Shift</kbd> <span>Larger steps</span></div>
    <div class="help-title" style="margin-top:8px">Mouse</div>
    <div class="help-row"><span>Drag</span> <span>Rotate globe</span></div>
  </div>
  <div class="divider"></div>
  <div class="status-row">
    <div class="status" id="status">Paste GeoJSON to visualize</div>
    <button class="clear-btn" id="clearBtn">Clear</button>
  </div>
  <div class="textarea-wrap">
    <textarea id="geojsonInput" rows="2" placeholder="Paste GeoJSON Polygon or MultiPolygon..." spellcheck="false"></textarea>
    <button class="copy-btn" id="copyBtn" title="Copy to clipboard">
      <svg id="copyIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>
</div>

<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import { feature } from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';

const container = document.getElementById('globe');
const geojsonInput = document.getElementById('geojsonInput');
const statusEl = document.getElementById('status');

// State
let geoFeature = null; // parsed GeoJSON feature for rendering
let rotate = [0, -30, 0];

// Load land data
const landTopo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json();
const land = feature(landTopo, landTopo.objects.land);
const graticule = d3.geoGraticule10();

// Projection and path generator
const projection = d3.geoOrthographic().rotate(rotate);
const path = d3.geoPath(projection);

// Create SVG once
const svg = d3.select(container).append('svg');

// Static layers
const graticuleLayer = svg.append('path')
  .datum(graticule)
  .attr('fill', 'none');

const landLayer = svg.append('path')
  .datum(land)
  .attr('fill', 'none')
  .attr('stroke-width', 0.8)
  .attr('stroke-opacity', 0.8);

const geoLayer = svg.append('g');

const sphereLayer = svg.append('path')
  .datum({ type: 'Sphere' })
  .attr('fill', 'none')
  .attr('stroke-width', 1.5);

function getSize() {
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  return Math.min(w, h) - 24;
}

function updateStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', !!isError);
}

function resize() {
  const size = getSize();
  svg.attr('width', size).attr('height', size);
  projection
    .translate([size / 2, size / 2])
    .scale(size / 2 - 1);
  redraw();
}

function redraw() {
  projection.rotate(rotate);
  const s = getComputedStyle(document.body);
  graticuleLayer.attr('stroke', s.getPropertyValue('--grid-stroke')).attr('stroke-opacity', s.getPropertyValue('--grid-opacity')).attr('d', path);
  landLayer.attr('stroke', s.getPropertyValue('--land-stroke')).attr('d', path);
  sphereLayer.attr('stroke', s.getPropertyValue('--sphere-stroke')).attr('d', path);
  redrawGeo();
}

function redrawGeo() {
  const fill = getComputedStyle(document.body).getPropertyValue('--cell-fill').trim();

  if (!geoFeature) {
    geoLayer.selectAll('path').remove();
    return;
  }

  const sel = geoLayer.selectAll('path').data([geoFeature]);
  sel.exit().remove();
  sel.enter().append('path')
    .merge(sel)
    .attr('fill', fill)
    .attr('fill-opacity', 0.35)
    .attr('stroke', fill)
    .attr('stroke-opacity', 0.8)
    .attr('stroke-width', 1.5)
    .attr('d', path);
}

// Versor math for 3D rotation
const versor = {
  cartesian(e) {
    const l = e[0] * Math.PI / 180, p = e[1] * Math.PI / 180, cp = Math.cos(p);
    return [cp * Math.cos(l), cp * Math.sin(l), Math.sin(p)];
  },
  rotation(q) {
    return [
      Math.atan2(2*(q[0]*q[1]+q[2]*q[3]), 1-2*(q[1]*q[1]+q[2]*q[2])) * 180/Math.PI,
      Math.asin(Math.max(-1, Math.min(1, 2*(q[0]*q[2]-q[3]*q[1])))) * 180/Math.PI,
      Math.atan2(2*(q[0]*q[3]+q[1]*q[2]), 1-2*(q[2]*q[2]+q[3]*q[3])) * 180/Math.PI
    ];
  },
  delta(v0, v1) {
    const w = this.cross(v0, v1), l = Math.sqrt(this.dot(w, w));
    if (!l) return [1, 0, 0, 0];
    const t = Math.acos(Math.max(-1, Math.min(1, this.dot(v0, v1)))) / 2, s = Math.sin(t);
    return [Math.cos(t), w[2]/l*s, -w[1]/l*s, w[0]/l*s];
  },
  multiply(a, b) {
    return [
      a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
      a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
      a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
      a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]
    ];
  },
  from(r) {
    const l = r[0]/2*Math.PI/180, p = r[1]/2*Math.PI/180, g = r[2]/2*Math.PI/180;
    const sl = Math.sin(l), cl = Math.cos(l), sp = Math.sin(p), cp = Math.cos(p), sg = Math.sin(g), cg = Math.cos(g);
    return [cl*cp*cg+sl*sp*sg, sl*cp*cg-cl*sp*sg, cl*sp*cg+sl*cp*sg, cl*cp*sg-sl*sp*cg];
  },
  cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; },
  dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
};

// Drag interaction
let v0, q0, r0;

const drag = d3.drag()
  .on('start', function(event) {
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (inv) {
      v0 = versor.cartesian(inv);
      r0 = rotate;
      q0 = versor.from(r0);
    }
  })
  .on('drag', function(event) {
    if (!v0) return;
    projection.rotate(r0);
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (!inv) return;
    const v1 = versor.cartesian(inv);
    const delta = versor.delta(v0, v1);
    const q1 = versor.multiply(q0, delta);
    rotate = versor.rotation(q1);
    redraw();
  });

svg.call(drag);

// Parse GeoJSON input
function parseGeoJSON(text) {
  text = text.trim();
  if (!text) return null;

  const obj = JSON.parse(text);

  // Accept bare geometry
  if (obj.type === 'Polygon' || obj.type === 'MultiPolygon') {
    return { type: 'Feature', geometry: reverseWinding(obj), properties: {} };
  }
  // Accept Feature
  if (obj.type === 'Feature' && obj.geometry &&
      (obj.geometry.type === 'Polygon' || obj.geometry.type === 'MultiPolygon')) {
    return { ...obj, geometry: reverseWinding(obj.geometry) };
  }
  // Accept FeatureCollection — merge all Polygon/MultiPolygon geometries
  if (obj.type === 'FeatureCollection' && Array.isArray(obj.features)) {
    const polygons = [];
    for (const f of obj.features) {
      if (!f.geometry) continue;
      if (f.geometry.type === 'Polygon') {
        polygons.push(f.geometry.coordinates);
      } else if (f.geometry.type === 'MultiPolygon') {
        polygons.push(...f.geometry.coordinates);
      }
    }
    if (polygons.length === 0) throw new Error('No Polygon/MultiPolygon features found');
    return {
      type: 'Feature',
      geometry: reverseWinding({ type: 'MultiPolygon', coordinates: polygons }),
      properties: {}
    };
  }

  throw new Error('Expected Polygon, MultiPolygon, Feature, or FeatureCollection');
}

// Reverse ring winding order: GeoJSON uses RFC 7946 (CCW outer, CW holes)
// but D3 uses the opposite convention
function reverseWinding(geometry) {
  if (geometry.type === 'Polygon') {
    return { ...geometry, coordinates: geometry.coordinates.map(ring => ring.slice().reverse()) };
  } else if (geometry.type === 'MultiPolygon') {
    return {
      ...geometry,
      coordinates: geometry.coordinates.map(poly =>
        poly.map(ring => ring.slice().reverse())
      )
    };
  }
  return geometry;
}

function computeCentroid(feature) {
  const coords = [];
  const geom = feature.geometry;
  if (geom.type === 'Polygon') {
    coords.push(...geom.coordinates[0]);
  } else if (geom.type === 'MultiPolygon') {
    for (const poly of geom.coordinates) {
      coords.push(...poly[0]);
    }
  }
  if (coords.length === 0) return null;
  let lngSum = 0, latSum = 0;
  for (const [lng, lat] of coords) {
    lngSum += lng;
    latSum += lat;
  }
  return [lngSum / coords.length, latSum / coords.length];
}

function syncFromText() {
  const text = geojsonInput.value.trim();
  if (!text) {
    geoFeature = null;
    updateStatus('Paste GeoJSON to visualize');
    redrawGeo();
    return;
  }

  try {
    geoFeature = parseGeoJSON(text);
    const geom = geoFeature.geometry;

    let ringCount = 0;
    if (geom.type === 'Polygon') {
      ringCount = geom.coordinates.length;
    } else if (geom.type === 'MultiPolygon') {
      for (const poly of geom.coordinates) ringCount += poly.length;
    }

    updateStatus(`${geom.type} · ${ringCount} ring${ringCount !== 1 ? 's' : ''}`);

    // Center globe on the polygon
    const center = computeCentroid(geoFeature);
    if (center) {
      rotate = [-center[0], -center[1], 0];
    }

    redraw();
  } catch (e) {
    geoFeature = null;
    updateStatus(e.message, true);
    redrawGeo();
  }
}

geojsonInput.addEventListener('input', syncFromText);
window.addEventListener('resize', resize);

document.addEventListener('keydown', (event) => {
  if (event.target === geojsonInput) return;
  const step = event.shiftKey ? 30 : 10;
  const key = event.key;

  if (key === 'ArrowLeft' || key === 'q' || key === 'Q') {
    rotate = [rotate[0], rotate[1], (rotate[2] || 0) + step];
    redraw();
    event.preventDefault();
  } else if (key === 'ArrowRight' || key === 'e' || key === 'E') {
    rotate = [rotate[0], rotate[1], (rotate[2] || 0) - step];
    redraw();
    event.preventDefault();
  }
  else if (key === 'ArrowUp' || key === 'w' || key === 'W'
        || key === 'ArrowDown' || key === 's' || key === 'S') {
    const sign = (key === 'ArrowUp' || key === 'w' || key === 'W') ? 1 : -1;
    const ha = sign * step / 2 * Math.PI / 180;
    const q = versor.from(rotate);
    const qRot = [Math.cos(ha), 0, Math.sin(ha), 0];
    rotate = versor.rotation(versor.multiply(qRot, q));
    redraw();
    event.preventDefault();
  }
  else if (key === 'a' || key === 'A' || key === 'd' || key === 'D') {
    const sign = (key === 'a' || key === 'A') ? -1 : 1;
    const ha = sign * step / 2 * Math.PI / 180;
    const q = versor.from(rotate);
    const qRot = [Math.cos(ha), Math.sin(ha), 0, 0];
    rotate = versor.rotation(versor.multiply(qRot, q));
    redraw();
    event.preventDefault();
  }
});

function svgToCanvas() {
  return new Promise((resolve) => {
    const svgEl = container.querySelector('svg');
    const size = parseInt(svgEl.getAttribute('width'));
    const pad = 24;
    const total = size + pad * 2;
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = total * scale;
    canvas.height = total * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    const bg = getComputedStyle(document.body).getPropertyValue('--bg').trim();
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, total, total);

    const svgData = new XMLSerializer().serializeToString(svgEl);
    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, pad, pad, size, size);
      URL.revokeObjectURL(url);
      resolve(canvas);
    };
    img.src = url;
  });
}

document.getElementById('copyImageBtn').addEventListener('click', async () => {
  const btn = document.getElementById('copyImageBtn');
  const canvas = await svgToCanvas();
  canvas.toBlob(async (blob) => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      btn.style.color = '#22c55e';
      setTimeout(() => btn.style.color = '', 1500);
    } catch {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'geojson.png';
      a.click();
    }
  }, 'image/png');
});

document.getElementById('downloadImageBtn').addEventListener('click', async () => {
  const btn = document.getElementById('downloadImageBtn');
  const canvas = await svgToCanvas();
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'geojson.png';
    a.click();
    btn.style.color = '#22c55e';
    setTimeout(() => btn.style.color = '', 1500);
  }, 'image/png');
});
