<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>H3 Cell Viz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --sidebar: #161b22;
    --input-bg: #0d1117;
    --text: #c9d1d9;
    --text-dim: rgba(201, 209, 217, 0.55);
    --text-dimmer: rgba(201, 209, 217, 0.3);
    --border: rgba(240,246,252,0.1);
    --border-focus: rgba(240,246,252,0.3);
    --btn-bg: rgba(240,246,252,0.04);
    --btn-hover: rgba(240,246,252,0.1);
    --btn-active: rgba(240,246,252,0.16);
    --accent: #4a9eff;
    --accent-glow: rgba(74, 158, 255, 0.15);
    --land-stroke: #6e7e96;
    --grid-stroke: #c9d1d9;
    --grid-opacity: 0.04;
    --sphere-stroke: #3d4856;
    --cell-fill: #4a9eff;
    --slider-track: rgba(240,246,252,0.08);
    --slider-fill: var(--accent);
  }
  .light {
    --bg: #f6f8fa;
    --sidebar: #ffffff;
    --input-bg: #f6f8fa;
    --text: #1f2328;
    --text-dim: rgba(31, 35, 40, 0.5);
    --text-dimmer: rgba(31, 35, 40, 0.3);
    --border: rgba(31,35,40,0.12);
    --border-focus: rgba(31,35,40,0.3);
    --btn-bg: rgba(31,35,40,0.04);
    --btn-hover: rgba(31,35,40,0.08);
    --btn-active: rgba(31,35,40,0.14);
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.1);
    --land-stroke: #656d76;
    --grid-stroke: #1f2328;
    --grid-opacity: 0.06;
    --sphere-stroke: #afb8c1;
    --cell-fill: #2563eb;
    --slider-track: rgba(31,35,40,0.1);
    --slider-fill: var(--accent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* Globe */
  #globe {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
    cursor: grab;
    position: relative;
  }
  #globe:active { cursor: grabbing; }

  /* Sidebar */
  .input-bar {
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    background: var(--sidebar);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: background 0.3s ease;
  }

  /* Header row */
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .theme-toggle {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
  }
  .theme-toggle:hover { color: var(--text); }
  .theme-toggle svg { width: 16px; height: 16px; }

  /* Resolution control */
  .res-control {
    flex-shrink: 0;
  }
  .res-label {
    font-size: 0.65rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .res-label .res-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text);
    min-width: 1ch;
    text-align: right;
  }
  .res-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .res-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 500;
    width: 30px;
    height: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .res-btn:hover { background: var(--btn-hover); color: var(--text); border-color: var(--border-focus); }
  .res-btn:active { background: var(--btn-active); }

  /* Custom range slider */
  .res-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: var(--slider-track);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .res-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--sidebar);
    cursor: pointer;
    transition: box-shadow 0.15s;
  }
  .res-row input[type="range"]::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 4px var(--accent-glow);
  }
  .res-row input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--sidebar);
    cursor: pointer;
  }

  /* Status + clear row */
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .clear-btn {
    background: none;
    border: none;
    color: var(--text-dimmer);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    padding: 2px 0;
    transition: color 0.15s;
  }
  .clear-btn:hover { color: var(--accent); }

  /* Textarea */
  .input-bar textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 400;
    line-height: 1.6;
    padding: 10px 12px;
    resize: none;
    outline: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .input-bar textarea::placeholder {
    color: var(--text-dimmer);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.75rem;
    font-style: italic;
  }
  .input-bar textarea:focus {
    border-color: var(--border-focus);
  }

  /* Dividers */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0;
  }

  /* Desktop layout */
  @media (min-width: 768px) {
    body {
      flex-direction: row;
    }
    .input-bar {
      width: 260px;
      flex-shrink: 0;
      border-top: none;
      border-right: 1px solid var(--border);
      order: -1;
      padding: 16px;
      gap: 14px;
    }
    .input-bar textarea {
      flex: 1;
      resize: none;
    }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div class="input-bar">
  <div class="sidebar-header">
    <span class="sidebar-title">H3 Cell Viz</span>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>
  </div>
  <div class="divider"></div>
  <div class="res-control">
    <div class="res-label">
      <span>Resolution</span>
      <span class="res-num" id="resValue"></span>
    </div>
    <div class="res-row">
      <button class="res-btn" id="resMinus">&minus;</button>
      <input type="range" id="resSlider" min="0" max="5" step="1">
      <button class="res-btn" id="resPlus">+</button>
    </div>
  </div>
  <div class="divider"></div>
  <div class="status-row">
    <div class="status" id="status"></div>
    <button class="clear-btn" id="clearCells">Clear</button>
  </div>
  <textarea id="cellInput" rows="2" placeholder="Paste or type H3 cell IDs..." spellcheck="false"></textarea>
</div>

<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import { feature } from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';
import * as h3 from 'https://cdn.jsdelivr.net/npm/h3-js/+esm';

const container = document.getElementById('globe');
const cellInput = document.getElementById('cellInput');
const statusEl = document.getElementById('status');
const resSlider = document.getElementById('resSlider');
const resValue = document.getElementById('resValue');

// State
let cells = new Set();
let rotate = [0, -30, 0];
let currentRes = 1;

// Load land data
const landTopo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json();
const land = feature(landTopo, landTopo.objects.land);
const graticule = d3.geoGraticule10();

// Projection and path generator (persistent, updated in place)
const projection = d3.geoOrthographic().rotate(rotate);
const path = d3.geoPath(projection);

// Create SVG once
const svg = d3.select(container).append('svg');

// Static layers
const graticuleLayer = svg.append('path')
  .datum(graticule)
  .attr('fill', 'none');

const landLayer = svg.append('path')
  .datum(land)
  .attr('fill', 'none')
  .attr('stroke-width', 0.8)
  .attr('stroke-opacity', 0.8);

const cellLayer = svg.append('g');

const sphereLayer = svg.append('path')
  .datum({ type: 'Sphere' })
  .attr('fill', 'none')
  .attr('stroke-width', 1.5);

function getSize() {
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  return Math.min(w, h) - 24;
}

function cellsToGeoJSON(cellSet) {
  const features = [];
  for (const cell of cellSet) {
    const boundary = h3.cellToBoundary(cell);
    // h3 returns [[lat,lng],...], convert to GeoJSON [lng,lat]
    const coords = boundary.map(([lat, lng]) => [lng, lat]);
    coords.push(coords[0]); // close ring
    // Reverse for D3 winding convention
    coords.reverse();
    features.push({
      type: 'Feature',
      properties: { cell },
      geometry: { type: 'Polygon', coordinates: [coords] }
    });
  }
  return features;
}

function updateStatus() {
  const n = cells.size;
  if (n === 0) {
    statusEl.textContent = `Click globe or type IDs \u00b7 res ${currentRes}`;
  } else {
    statusEl.textContent = `${n} cell${n > 1 ? 's' : ''} \u00b7 res ${currentRes}`;
  }
}

function resize() {
  const size = getSize();
  svg.attr('width', size).attr('height', size);
  projection
    .translate([size / 2, size / 2])
    .scale(size / 2 - 1);
  redraw();
}

function redraw() {
  projection.rotate(rotate);
  const s = getComputedStyle(document.body);
  graticuleLayer.attr('stroke', s.getPropertyValue('--grid-stroke')).attr('stroke-opacity', s.getPropertyValue('--grid-opacity')).attr('d', path);
  landLayer.attr('stroke', s.getPropertyValue('--land-stroke')).attr('d', path);
  sphereLayer.attr('stroke', s.getPropertyValue('--sphere-stroke')).attr('d', path);
  redrawCells();
}

function redrawCells() {
  const features = cellsToGeoJSON(cells);
  const sel = cellLayer.selectAll('path').data(features, d => d.properties.cell);
  sel.exit().remove();
  const sw = currentRes >= 5 ? 0.5 : currentRes >= 4 ? 0.8 : 1.5;
  const fill = getComputedStyle(document.body).getPropertyValue('--cell-fill').trim();
  sel.enter().append('path')
    .attr('fill-opacity', 0.45)
    .attr('stroke-opacity', 0.8)
    .merge(sel)
    .attr('fill', fill)
    .attr('stroke', fill)
    .attr('stroke-width', sw)
    .attr('d', path);
}

// Versor math for 3D rotation
const versor = {
  cartesian(e) {
    const l = e[0] * Math.PI / 180, p = e[1] * Math.PI / 180, cp = Math.cos(p);
    return [cp * Math.cos(l), cp * Math.sin(l), Math.sin(p)];
  },
  rotation(q) {
    return [
      Math.atan2(2*(q[0]*q[1]+q[2]*q[3]), 1-2*(q[1]*q[1]+q[2]*q[2])) * 180/Math.PI,
      Math.asin(Math.max(-1, Math.min(1, 2*(q[0]*q[2]-q[3]*q[1])))) * 180/Math.PI,
      Math.atan2(2*(q[0]*q[3]+q[1]*q[2]), 1-2*(q[2]*q[2]+q[3]*q[3])) * 180/Math.PI
    ];
  },
  delta(v0, v1) {
    const w = this.cross(v0, v1), l = Math.sqrt(this.dot(w, w));
    if (!l) return [1, 0, 0, 0];
    const t = Math.acos(Math.max(-1, Math.min(1, this.dot(v0, v1)))) / 2, s = Math.sin(t);
    return [Math.cos(t), w[2]/l*s, -w[1]/l*s, w[0]/l*s];
  },
  multiply(a, b) {
    return [
      a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
      a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
      a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
      a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]
    ];
  },
  from(r) {
    const l = r[0]/2*Math.PI/180, p = r[1]/2*Math.PI/180, g = r[2]/2*Math.PI/180;
    const sl = Math.sin(l), cl = Math.cos(l), sp = Math.sin(p), cp = Math.cos(p), sg = Math.sin(g), cg = Math.cos(g);
    return [cl*cp*cg+sl*sp*sg, sl*cp*cg-cl*sp*sg, cl*sp*cg+sl*cp*sg, cl*cp*sg-sl*sp*cg];
  },
  cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; },
  dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
};

// Drag + click interaction (bound once to the persistent SVG)
let v0, q0, r0, totalMove;

const drag = d3.drag()
  .on('start', function(event) {
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (inv) {
      v0 = versor.cartesian(inv);
      r0 = rotate;
      q0 = versor.from(r0);
      totalMove = 0;
    }
  })
  .on('drag', function(event) {
    if (!v0) return;
    totalMove += Math.abs(event.dx) + Math.abs(event.dy);
    projection.rotate(r0);
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (!inv) return;
    const v1 = versor.cartesian(inv);
    const delta = versor.delta(v0, v1);
    const q1 = versor.multiply(q0, delta);
    rotate = versor.rotation(q1);
    redraw();
  })
  .on('end', function(event) {
    if (totalMove < 3) {
      const p = d3.pointer(event, this);
      const inv = projection.invert(p);
      if (inv) {
        handleGlobeClick(inv[1], inv[0]);
      }
    }
  });

svg.call(drag);

function handleGlobeClick(lat, lng) {
  const cell = h3.latLngToCell(lat, lng, currentRes);
  if (cells.has(cell)) {
    cells.delete(cell);
  } else {
    cells.add(cell);
  }
  syncTextFromCells();
  redrawCells();
  updateStatus();
}

function syncTextFromCells() {
  cellInput.value = [...cells].join('\n');
}

function parseTokens(text) {
  // Strip quotes, brackets, parens; split on any combo of whitespace, commas, semicolons
  return text.replace(/['"`\[\](){}]/g, '').split(/[\s,;]+/).filter(Boolean);
}

function syncCellsFromText() {
  const tokens = parseTokens(cellInput.value);

  const newCells = new Set();
  let detectedRes = null;

  for (const token of tokens) {
    if (!h3.isValidCell(token)) continue;
    const res = h3.getResolution(token);
    if (detectedRes === null) {
      detectedRes = res;
    } else if (res !== detectedRes) {
      continue;
    }
    newCells.add(token);
  }

  if (detectedRes !== null) {
    currentRes = detectedRes;
  }

  cells = newCells;
  syncResSlider();
  redrawCells();
  updateStatus();
}

function syncResSlider() {
  resSlider.value = currentRes;
  resValue.textContent = currentRes;
}

function changeResolution(newRes) {
  if (newRes === currentRes) return;
  if (cells.size > 0) {
    const newCells = new Set();
    if (newRes < currentRes) {
      // Coarser: get parent cells, dedupe
      for (const cell of cells) {
        newCells.add(h3.cellToParent(cell, newRes));
      }
    } else {
      // Finer: get children cells
      for (const cell of cells) {
        for (const child of h3.cellToChildren(cell, newRes)) {
          newCells.add(child);
        }
      }
    }
    cells = newCells;
  }
  currentRes = newRes;
  syncResSlider();
  syncTextFromCells();
  redrawCells();
  updateStatus();
}

resSlider.addEventListener('input', () => {
  changeResolution(parseInt(resSlider.value));
});

document.getElementById('resMinus').addEventListener('click', () => {
  if (currentRes > 0) changeResolution(currentRes - 1);
});

document.getElementById('resPlus').addEventListener('click', () => {
  if (currentRes < 5) changeResolution(currentRes + 1);
});

cellInput.addEventListener('input', syncCellsFromText);
cellInput.addEventListener('blur', () => {
  if (cells.size > 0) syncTextFromCells();
});
window.addEventListener('resize', resize);

document.addEventListener('keydown', (event) => {
  if (event.target === cellInput) return;
  const step = event.shiftKey ? 30 : 10;
  if (event.key === 'ArrowLeft') {
    rotate = [rotate[0], rotate[1], (rotate[2] || 0) + step];
    redraw();
    event.preventDefault();
  } else if (event.key === 'ArrowRight') {
    rotate = [rotate[0], rotate[1], (rotate[2] || 0) - step];
    redraw();
    event.preventDefault();
  } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
    const sign = event.key === 'ArrowUp' ? 1 : -1;
    const ha = sign * step / 2 * Math.PI / 180;
    const q = versor.from(rotate);
    const qRot = [Math.cos(ha), 0, Math.sin(ha), 0];
    rotate = versor.rotation(versor.multiply(qRot, q));
    redraw();
    event.preventDefault();
  }
});

document.getElementById('clearCells').addEventListener('click', () => {
  cells = new Set();
  syncTextFromCells();
  redrawCells();
  updateStatus();
});

const sunIcon = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';

document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('light');
  const light = document.body.classList.contains('light');
  document.getElementById('themeIcon').innerHTML = light ? moonIcon : sunIcon;
  redraw();
});

syncResSlider();
resize();
</script>
</body>
</html>
