<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>H3 Cell Viz</title>
<style>
  :root {
    --bg: #1a1a2e;
    --sidebar: #16213e;
    --input-bg: #0f3460;
    --text: #e0d6c8;
    --text-dim: rgba(224, 214, 200, 0.6);
    --text-dimmer: rgba(224, 214, 200, 0.4);
    --border: rgba(255,255,255,0.1);
    --border-focus: rgba(255,255,255,0.3);
    --btn-bg: rgba(255,255,255,0.08);
    --btn-hover: rgba(255,255,255,0.15);
    --btn-active: rgba(255,255,255,0.2);
    --land-stroke: #88b;
    --grid-stroke: #fff;
    --grid-opacity: 0.06;
    --sphere-stroke: #fff;
    --cell-fill: #e94560;
  }
  .light {
    --bg: #f0f0f0;
    --sidebar: #e2e2e2;
    --input-bg: #fff;
    --text: #1a1a2e;
    --text-dim: rgba(26, 26, 46, 0.6);
    --text-dimmer: rgba(26, 26, 46, 0.35);
    --border: rgba(0,0,0,0.12);
    --border-focus: rgba(0,0,0,0.3);
    --btn-bg: rgba(0,0,0,0.06);
    --btn-hover: rgba(0,0,0,0.12);
    --btn-active: rgba(0,0,0,0.18);
    --land-stroke: #667;
    --grid-stroke: #000;
    --grid-opacity: 0.08;
    --sphere-stroke: #333;
    --cell-fill: #d63031;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  #globe {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
    cursor: grab;
  }
  #globe:active { cursor: grabbing; }
  .input-bar {
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    background: var(--sidebar);
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: background 0.2s;
  }
  .input-bar textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem;
    padding: 8px 12px;
    resize: none;
    outline: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .input-bar textarea::placeholder {
    color: var(--text-dimmer);
  }
  .input-bar textarea:focus {
    border-color: var(--border-focus);
  }
  .res-control {
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .res-control label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .res-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .res-row input[type="range"] {
    flex: 1;
    accent-color: #e94560;
  }
  .res-row span {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem;
    min-width: 1.8em;
    text-align: center;
  }
  .res-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 1rem;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .res-btn:hover { background: var(--btn-hover); }
  .res-btn:active { background: var(--btn-active); }
  .theme-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 0.8rem;
    padding: 4px 10px;
    cursor: pointer;
    align-self: flex-end;
    margin-bottom: 10px;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .theme-btn:hover { background: var(--btn-hover); }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .status {
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  @media (min-width: 768px) {
    body {
      flex-direction: row;
    }
    .input-bar {
      width: 280px;
      flex-shrink: 0;
      border-top: none;
      border-right: 1px solid var(--border);
      order: -1;
      padding: 16px;
    }
    .input-bar textarea {
      flex: 1;
      resize: none;
    }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div class="input-bar">
  <button class="theme-btn" id="themeToggle">Light</button>
  <div class="res-control">
    <label for="resSlider">Resolution</label>
    <div class="res-row">
      <button class="res-btn" id="resMinus">&minus;</button>
      <input type="range" id="resSlider" min="0" max="5" step="1">
      <button class="res-btn" id="resPlus">+</button>
      <span id="resValue"></span>
    </div>
  </div>
  <div class="status-row">
    <div class="status" id="status"></div>
    <button class="theme-btn" id="clearCells">Clear</button>
  </div>
  <textarea id="cellInput" rows="2" placeholder="Enter H3 cell IDs&#10;&#10;e.g., 8928308280fffff" spellcheck="false"></textarea>
</div>

<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import { feature } from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';
import * as h3 from 'https://cdn.jsdelivr.net/npm/h3-js/+esm';

const container = document.getElementById('globe');
const cellInput = document.getElementById('cellInput');
const statusEl = document.getElementById('status');
const resSlider = document.getElementById('resSlider');
const resValue = document.getElementById('resValue');

// State
let cells = new Set();
let rotate = [0, -30, 0];
let currentRes = 1;

// Load land data
const landTopo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json();
const land = feature(landTopo, landTopo.objects.land);
const graticule = d3.geoGraticule10();

// Projection and path generator (persistent, updated in place)
const projection = d3.geoOrthographic().rotate(rotate);
const path = d3.geoPath(projection);

// Create SVG once
const svg = d3.select(container).append('svg');

// Static layers
const graticuleLayer = svg.append('path')
  .datum(graticule)
  .attr('fill', 'none');

const landLayer = svg.append('path')
  .datum(land)
  .attr('fill', 'none')
  .attr('stroke-width', 0.8)
  .attr('stroke-opacity', 0.8);

const cellLayer = svg.append('g');

const sphereLayer = svg.append('path')
  .datum({ type: 'Sphere' })
  .attr('fill', 'none')
  .attr('stroke-width', 2);

function getSize() {
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  return Math.min(w, h) - 24;
}

function cellsToGeoJSON(cellSet) {
  const features = [];
  for (const cell of cellSet) {
    const boundary = h3.cellToBoundary(cell);
    // h3 returns [[lat,lng],...], convert to GeoJSON [lng,lat]
    const coords = boundary.map(([lat, lng]) => [lng, lat]);
    coords.push(coords[0]); // close ring
    // Reverse for D3 winding convention
    coords.reverse();
    features.push({
      type: 'Feature',
      properties: { cell },
      geometry: { type: 'Polygon', coordinates: [coords] }
    });
  }
  return features;
}

function updateStatus() {
  const n = cells.size;
  if (n === 0) {
    statusEl.textContent = `Click globe or type cell IDs \u00b7 res ${currentRes}`;
  } else {
    statusEl.textContent = `${n} cell${n > 1 ? 's' : ''} \u00b7 res ${currentRes}`;
  }
}

function resize() {
  const size = getSize();
  svg.attr('width', size).attr('height', size);
  projection
    .translate([size / 2, size / 2])
    .scale(size / 2 - 1);
  redraw();
}

function redraw() {
  projection.rotate(rotate);
  const s = getComputedStyle(document.body);
  graticuleLayer.attr('stroke', s.getPropertyValue('--grid-stroke')).attr('stroke-opacity', s.getPropertyValue('--grid-opacity')).attr('d', path);
  landLayer.attr('stroke', s.getPropertyValue('--land-stroke')).attr('d', path);
  sphereLayer.attr('stroke', s.getPropertyValue('--sphere-stroke')).attr('d', path);
  redrawCells();
}

function redrawCells() {
  const features = cellsToGeoJSON(cells);
  const sel = cellLayer.selectAll('path').data(features, d => d.properties.cell);
  sel.exit().remove();
  const sw = currentRes >= 5 ? 0.5 : currentRes >= 4 ? 0.8 : 1.5;
  const fill = getComputedStyle(document.body).getPropertyValue('--cell-fill').trim();
  sel.enter().append('path')
    .attr('fill-opacity', 0.45)
    .attr('stroke-opacity', 0.8)
    .merge(sel)
    .attr('fill', fill)
    .attr('stroke', fill)
    .attr('stroke-width', sw)
    .attr('d', path);
}

// Versor math for 3D rotation
const versor = {
  cartesian(e) {
    const l = e[0] * Math.PI / 180, p = e[1] * Math.PI / 180, cp = Math.cos(p);
    return [cp * Math.cos(l), cp * Math.sin(l), Math.sin(p)];
  },
  rotation(q) {
    return [
      Math.atan2(2*(q[0]*q[1]+q[2]*q[3]), 1-2*(q[1]*q[1]+q[2]*q[2])) * 180/Math.PI,
      Math.asin(Math.max(-1, Math.min(1, 2*(q[0]*q[2]-q[3]*q[1])))) * 180/Math.PI,
      Math.atan2(2*(q[0]*q[3]+q[1]*q[2]), 1-2*(q[2]*q[2]+q[3]*q[3])) * 180/Math.PI
    ];
  },
  delta(v0, v1) {
    const w = this.cross(v0, v1), l = Math.sqrt(this.dot(w, w));
    if (!l) return [1, 0, 0, 0];
    const t = Math.acos(Math.max(-1, Math.min(1, this.dot(v0, v1)))) / 2, s = Math.sin(t);
    return [Math.cos(t), w[2]/l*s, -w[1]/l*s, w[0]/l*s];
  },
  multiply(a, b) {
    return [
      a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
      a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
      a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
      a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]
    ];
  },
  from(r) {
    const l = r[0]/2*Math.PI/180, p = r[1]/2*Math.PI/180, g = r[2]/2*Math.PI/180;
    const sl = Math.sin(l), cl = Math.cos(l), sp = Math.sin(p), cp = Math.cos(p), sg = Math.sin(g), cg = Math.cos(g);
    return [cl*cp*cg+sl*sp*sg, sl*cp*cg-cl*sp*sg, cl*sp*cg+sl*cp*sg, cl*cp*sg-sl*sp*cg];
  },
  cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; },
  dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
};

// Drag + click interaction (bound once to the persistent SVG)
let v0, q0, r0, totalMove;

const drag = d3.drag()
  .on('start', function(event) {
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (inv) {
      v0 = versor.cartesian(inv);
      r0 = rotate;
      q0 = versor.from(r0);
      totalMove = 0;
    }
  })
  .on('drag', function(event) {
    if (!v0) return;
    totalMove += Math.abs(event.dx) + Math.abs(event.dy);
    projection.rotate(r0);
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (!inv) return;
    const v1 = versor.cartesian(inv);
    const delta = versor.delta(v0, v1);
    const q1 = versor.multiply(q0, delta);
    rotate = versor.rotation(q1);
    redraw();
  })
  .on('end', function(event) {
    if (totalMove < 3) {
      const p = d3.pointer(event, this);
      const inv = projection.invert(p);
      if (inv) {
        handleGlobeClick(inv[1], inv[0]);
      }
    }
  });

svg.call(drag);

function handleGlobeClick(lat, lng) {
  const cell = h3.latLngToCell(lat, lng, currentRes);
  if (cells.has(cell)) {
    cells.delete(cell);
  } else {
    cells.add(cell);
  }
  syncTextFromCells();
  redrawCells();
  updateStatus();
}

function syncTextFromCells() {
  cellInput.value = [...cells].join('\n');
}

function parseTokens(text) {
  // Strip quotes, brackets, parens; split on any combo of whitespace, commas, semicolons
  return text.replace(/['"`\[\](){}]/g, '').split(/[\s,;]+/).filter(Boolean);
}

function syncCellsFromText() {
  const tokens = parseTokens(cellInput.value);

  const newCells = new Set();
  let detectedRes = null;

  for (const token of tokens) {
    if (!h3.isValidCell(token)) continue;
    const res = h3.getResolution(token);
    if (detectedRes === null) {
      detectedRes = res;
    } else if (res !== detectedRes) {
      continue;
    }
    newCells.add(token);
  }

  if (detectedRes !== null) {
    currentRes = detectedRes;
  }

  cells = newCells;
  syncResSlider();
  redrawCells();
  updateStatus();
}

function syncResSlider() {
  resSlider.value = currentRes;
  resValue.textContent = currentRes;
}

function changeResolution(newRes) {
  if (newRes === currentRes) return;
  if (cells.size > 0) {
    const newCells = new Set();
    if (newRes < currentRes) {
      // Coarser: get parent cells, dedupe
      for (const cell of cells) {
        newCells.add(h3.cellToParent(cell, newRes));
      }
    } else {
      // Finer: get children cells
      for (const cell of cells) {
        for (const child of h3.cellToChildren(cell, newRes)) {
          newCells.add(child);
        }
      }
    }
    cells = newCells;
  }
  currentRes = newRes;
  syncResSlider();
  syncTextFromCells();
  redrawCells();
  updateStatus();
}

resSlider.addEventListener('input', () => {
  changeResolution(parseInt(resSlider.value));
});

document.getElementById('resMinus').addEventListener('click', () => {
  if (currentRes > 0) changeResolution(currentRes - 1);
});

document.getElementById('resPlus').addEventListener('click', () => {
  if (currentRes < 5) changeResolution(currentRes + 1);
});

cellInput.addEventListener('input', syncCellsFromText);
cellInput.addEventListener('blur', () => {
  if (cells.size > 0) syncTextFromCells();
});
window.addEventListener('resize', resize);

document.addEventListener('keydown', (event) => {
  if (event.target === cellInput) return;
  const step = event.shiftKey ? 30 : 10;
  if (event.key === 'ArrowLeft') {
    rotate = [rotate[0], rotate[1], (rotate[2] || 0) + step];
    redraw();
    event.preventDefault();
  } else if (event.key === 'ArrowRight') {
    rotate = [rotate[0], rotate[1], (rotate[2] || 0) - step];
    redraw();
    event.preventDefault();
  } else if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
    const sign = event.key === 'ArrowUp' ? 1 : -1;
    const ha = sign * step / 2 * Math.PI / 180;
    const q = versor.from(rotate);
    const qRot = [Math.cos(ha), 0, Math.sin(ha), 0];
    rotate = versor.rotation(versor.multiply(qRot, q));
    redraw();
    event.preventDefault();
  }
});

document.getElementById('clearCells').addEventListener('click', () => {
  cells = new Set();
  syncTextFromCells();
  redrawCells();
  updateStatus();
});

document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('light');
  const light = document.body.classList.contains('light');
  document.getElementById('themeToggle').textContent = light ? 'Dark' : 'Light';
  redraw();
});

syncResSlider();
resize();
</script>
</body>
</html>
