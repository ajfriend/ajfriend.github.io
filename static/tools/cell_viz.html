<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>H3 Cell Viz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0d6c8;
  }
  #globe {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
    cursor: grab;
  }
  #globe:active { cursor: grabbing; }
  .input-bar {
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    background: #16213e;
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
  }
  .input-bar textarea {
    width: 100%;
    background: #0f3460;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    color: #e0d6c8;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.85rem;
    padding: 8px 12px;
    resize: none;
    outline: none;
  }
  .input-bar textarea::placeholder {
    color: rgba(224, 214, 200, 0.4);
  }
  .input-bar textarea:focus {
    border-color: rgba(255,255,255,0.3);
  }
  .status {
    font-size: 0.75rem;
    color: rgba(224, 214, 200, 0.5);
    margin-top: 4px;
    text-align: right;
  }
  @media (min-width: 768px) {
    body {
      flex-direction: row;
    }
    .input-bar {
      width: 280px;
      flex-shrink: 0;
      border-top: none;
      border-right: 1px solid rgba(255,255,255,0.1);
      order: -1;
      padding: 16px;
    }
    .input-bar textarea {
      flex: 1;
      resize: none;
    }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div class="input-bar">
  <textarea id="cellInput" rows="2" placeholder="Enter H3 cell IDs, comma-separated&#10;&#10;e.g., 8928308280fffff" spellcheck="false"></textarea>
  <div class="status" id="status"></div>
</div>

<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';
import { feature } from 'https://cdn.jsdelivr.net/npm/topojson-client@3/+esm';
import * as h3 from 'https://cdn.jsdelivr.net/npm/h3-js/+esm';

const container = document.getElementById('globe');
const cellInput = document.getElementById('cellInput');
const statusEl = document.getElementById('status');

// State
let cells = new Set();
let rotate = [0, -30, 0];
let currentRes = 1;

// Load land data
const landTopo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json')).json();
const land = feature(landTopo, landTopo.objects.land);
const graticule = d3.geoGraticule10();

// Projection and path generator (persistent, updated in place)
const projection = d3.geoOrthographic().rotate(rotate);
const path = d3.geoPath(projection);

// Create SVG once
const svg = d3.select(container).append('svg');

// Static layers
const graticuleLayer = svg.append('path')
  .datum(graticule)
  .attr('fill', 'none')
  .attr('stroke', '#fff')
  .attr('stroke-opacity', 0.06);

const landLayer = svg.append('path')
  .datum(land)
  .attr('fill', 'none')
  .attr('stroke', '#88b')
  .attr('stroke-width', 0.8)
  .attr('stroke-opacity', 0.8);

const cellLayer = svg.append('g');

const sphereLayer = svg.append('path')
  .datum({ type: 'Sphere' })
  .attr('fill', 'none')
  .attr('stroke', '#fff')
  .attr('stroke-width', 2);

function getSize() {
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  return Math.min(w, h) - 24;
}

function cellsToGeoJSON(cellSet) {
  const features = [];
  for (const cell of cellSet) {
    const boundary = h3.cellToBoundary(cell);
    // h3 returns [[lat,lng],...], convert to GeoJSON [lng,lat]
    const coords = boundary.map(([lat, lng]) => [lng, lat]);
    coords.push(coords[0]); // close ring
    // Reverse for D3 winding convention
    coords.reverse();
    features.push({
      type: 'Feature',
      properties: { cell },
      geometry: { type: 'Polygon', coordinates: [coords] }
    });
  }
  return features;
}

function updateStatus() {
  const n = cells.size;
  if (n === 0) {
    statusEl.textContent = `Click globe or type cell IDs \u00b7 res ${currentRes}`;
  } else {
    statusEl.textContent = `${n} cell${n > 1 ? 's' : ''} \u00b7 res ${currentRes}`;
  }
}

function resize() {
  const size = getSize();
  svg.attr('width', size).attr('height', size);
  projection
    .translate([size / 2, size / 2])
    .scale(size / 2 - 1);
  redraw();
}

function redraw() {
  projection.rotate(rotate);
  graticuleLayer.attr('d', path);
  landLayer.attr('d', path);
  sphereLayer.attr('d', path);
  redrawCells();
}

function redrawCells() {
  const features = cellsToGeoJSON(cells);
  const sel = cellLayer.selectAll('path').data(features, d => d.properties.cell);
  sel.exit().remove();
  sel.enter().append('path')
    .attr('fill', '#e94560')
    .attr('fill-opacity', 0.45)
    .attr('stroke', '#e94560')
    .attr('stroke-width', 1.5)
    .attr('stroke-opacity', 0.8)
    .merge(sel)
    .attr('d', path);
}

// Versor math for 3D rotation
const versor = {
  cartesian(e) {
    const l = e[0] * Math.PI / 180, p = e[1] * Math.PI / 180, cp = Math.cos(p);
    return [cp * Math.cos(l), cp * Math.sin(l), Math.sin(p)];
  },
  rotation(q) {
    return [
      Math.atan2(2*(q[0]*q[1]+q[2]*q[3]), 1-2*(q[1]*q[1]+q[2]*q[2])) * 180/Math.PI,
      Math.asin(Math.max(-1, Math.min(1, 2*(q[0]*q[2]-q[3]*q[1])))) * 180/Math.PI,
      Math.atan2(2*(q[0]*q[3]+q[1]*q[2]), 1-2*(q[2]*q[2]+q[3]*q[3])) * 180/Math.PI
    ];
  },
  delta(v0, v1) {
    const w = this.cross(v0, v1), l = Math.sqrt(this.dot(w, w));
    if (!l) return [1, 0, 0, 0];
    const t = Math.acos(Math.max(-1, Math.min(1, this.dot(v0, v1)))) / 2, s = Math.sin(t);
    return [Math.cos(t), w[2]/l*s, -w[1]/l*s, w[0]/l*s];
  },
  multiply(a, b) {
    return [
      a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
      a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
      a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
      a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]
    ];
  },
  from(r) {
    const l = r[0]/2*Math.PI/180, p = r[1]/2*Math.PI/180, g = r[2]/2*Math.PI/180;
    const sl = Math.sin(l), cl = Math.cos(l), sp = Math.sin(p), cp = Math.cos(p), sg = Math.sin(g), cg = Math.cos(g);
    return [cl*cp*cg+sl*sp*sg, sl*cp*cg-cl*sp*sg, cl*sp*cg+sl*cp*sg, cl*cp*sg-sl*sp*cg];
  },
  cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; },
  dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
};

// Drag + click interaction (bound once to the persistent SVG)
let v0, q0, r0, totalMove;

const drag = d3.drag()
  .on('start', function(event) {
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (inv) {
      v0 = versor.cartesian(inv);
      r0 = rotate;
      q0 = versor.from(r0);
      totalMove = 0;
    }
  })
  .on('drag', function(event) {
    if (!v0) return;
    totalMove += Math.abs(event.dx) + Math.abs(event.dy);
    projection.rotate(r0);
    const p = d3.pointer(event, this);
    const inv = projection.invert(p);
    if (!inv) return;
    const v1 = versor.cartesian(inv);
    const delta = versor.delta(v0, v1);
    const q1 = versor.multiply(q0, delta);
    rotate = versor.rotation(q1);
    redraw();
  })
  .on('end', function(event) {
    if (totalMove < 3) {
      const p = d3.pointer(event, this);
      const inv = projection.invert(p);
      if (inv) {
        handleGlobeClick(inv[1], inv[0]);
      }
    }
  });

svg.call(drag);

function handleGlobeClick(lat, lng) {
  const cell = h3.latLngToCell(lat, lng, currentRes);
  if (cells.has(cell)) {
    cells.delete(cell);
  } else {
    cells.add(cell);
  }
  syncTextFromCells();
  redrawCells();
  updateStatus();
}

function syncTextFromCells() {
  cellInput.value = [...cells].join(', ');
}

function syncCellsFromText() {
  const text = cellInput.value;
  const tokens = text.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);

  const newCells = new Set();
  let detectedRes = null;

  for (const token of tokens) {
    if (!h3.isValidCell(token)) continue;
    const res = h3.getResolution(token);
    if (detectedRes === null) {
      detectedRes = res;
    } else if (res !== detectedRes) {
      continue;
    }
    newCells.add(token);
  }

  if (detectedRes !== null) {
    currentRes = detectedRes;
  }

  cells = newCells;
  redrawCells();
  updateStatus();
}

cellInput.addEventListener('input', syncCellsFromText);
window.addEventListener('resize', resize);

resize();
</script>
</body>
</html>
